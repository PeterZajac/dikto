name: Release

# Tags only, deliberately. A pull_request trigger — or a workflow_dispatch
# taking a ref — would hand the updater's signing key to anyone who can open
# a PR, and that key can install arbitrary code into an app that already holds
# Accessibility and Microphone grants.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # dtolnay/rust-toolchain@stable ignores rust-toolchain.toml — it installs
      # whatever "stable" resolves to for the @rev given, not the pinned channel.
      - name: Read pinned Rust toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - name: Add macOS universal targets
        if: matrix.os == 'macos-14'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Hand-rolled instead of letting tauri-action import APPLE_CERTIFICATE:
      # that path calls tauri_macos_sign::identity::list, which only matches
      # certificates whose common name starts with one of seven hardcoded
      # Apple prefixes ("Developer ID Application:", "Apple Development:", …)
      # and also requires an organizational unit. A self-signed "Dikto Dev"
      # matches none of them, so it fails with "failed to resolve signing
      # identity" no matter how correct the certificate is. Passing only
      # APPLE_SIGNING_IDENTITY takes tauri's other path, which just runs
      # `codesign -s` against the keychain search list.
      - name: Import the signing certificate
        if: matrix.os == 'macos-14'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/dikto.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this codesign blocks on a GUI prompt for key access.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # The identity has to be in the search list for `codesign -s` to find it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # A self-signed root is not a valid codesigning identity until something
          # trusts it; the developer's Mac has this from make-signing-cert.sh.
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

          security find-identity -v -p codesigning "$KEYCHAIN"
          rm "$CERT" "$RUNNER_TEMP/cert.pem"

      # These bullets become both the GitHub release body and latest.json.notes,
      # which is the text the in-app update banner shows. A pre-release tag
      # (v0.1.7-rc.1) reads the section of the version it rehearses (0.1.7).
      - name: Extract the changelog section for this tag
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="${VERSION%%-*}"
          BODY="$(awk -v heading="## $BASE " '
            index($0, heading) == 1 { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md)"
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            BODY="$(awk '/^## Unreleased$/ { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md)"
          fi
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no '## $BASE' section and no '## Unreleased' — nothing to release." >&2
            exit 1
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$BODY"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Deliberately no APPLE_CERTIFICATE — see the import step above.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dikto ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Both matrix legs write latest.json into the same draft release, and Tauri
  # validates the whole manifest before it compares versions — one malformed
  # platform key breaks updates for everyone. This is the check Playwright
  # cannot do, so it gates publishing.
  verify-updater-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the manifest from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p latest.json

      # Subset, not equality: tauri-action also emits a `windows-x86_64-nsis`
      # key alongside `windows-x86_64`, and would emit more if a target were
      # ever added. What matters is that the three the app asks for are there
      # and that nothing carries an empty url or signature.
      - name: Every platform must carry a URL and a signature
        run: |
          cat latest.json
          jq -e '
            .version
            and (.notes | length > 0)
            and ((["darwin-aarch64", "darwin-x86_64", "windows-x86_64"] - [.platforms | keys[]]) | length == 0)
            and (.platforms | to_entries | all(.value.url != "" and .value.signature != ""))
          ' latest.json
